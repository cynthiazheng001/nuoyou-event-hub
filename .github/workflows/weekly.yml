name: weekly refresh

on:
  schedule:
    - cron: "0 12 * * 1"     # every Monday 12:00 UTC = 8:00 AM US Eastern (7:00 AM in winter)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    paths: ["data.json", "posters/**", "build.py", "app.js", "style.css"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pull the sign-up sheet into data.json
        if: github.event_name != 'push'
        run: python3 sync_sheet.py
      - name: Build site/index.html
        run: python3 build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "nuoyou-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "auto refresh $(date -u +%Y-%m-%d)"
          git push
